services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >-
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (error) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
        }'

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo-init-replica:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import os,pymongo;
          pymongo.MongoClient(os.getenv("MONGO_URI"),serverSelectionTimeoutMS=2000)
          .admin.command("ping")'
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${NOVEL_CLIENT_PATH:-../ai_n0vel}:/app/Novel

volumes:
  mongo_data:
